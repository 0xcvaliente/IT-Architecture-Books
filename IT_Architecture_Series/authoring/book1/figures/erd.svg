<text x="628" y="165" font-size="13" font-weight="400" fill="#000000" text-anchor="start"><tspan x="628" dy="0">1 to 0..many</tspan></text>
</g>
<g data-label="r3" data-x="260" data-y="366" data-w="112" data-h="30"><rect x="260" y="366" width="112" height="30" rx="4" fill="#ffffff"/>
<text x="268" y="385" font-size="13" font-weight="400" fill="#000000" text-anchor="start"><tspan x="268" dy="0">1 to 0..many</tspan></text>
</g>
<g data-label="r4" data-x="620" data-y="366" data-w="112" data-h="30"><rect x="620" y="366" width="112" height="30" rx="4" fill="#ffffff"/>
<text x="628" y="385" font-size="13" font-weight="400" fill="#000000" text-anchor="start"><tspan x="628" dy="0">1 to 1..many</tspan></text>
</g>
</svg>
