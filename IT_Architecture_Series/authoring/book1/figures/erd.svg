<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 550" width="860" height="550" role="img" aria-labelledby="dc-f9c2f305de-title dc-f9c2f305de-desc" font-family="DejaVu Sans">
<title id="dc-f9c2f305de-title">Portal schema relationships</title>
<desc id="dc-f9c2f305de-desc">An asset has zero or more service requests, and a customer user submits zero or more service requests; each request names one asset and one submitter. A service request has zero or more attachments and one or more outbox records. The request holds the scoped submission key and payload hash. All keys include the tenant.</desc>
<defs><marker id="dc-f9c2f305de-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#323232"/></marker></defs>
<rect width="860" height="550" fill="#ffffff" aria-hidden="true"/>
<polyline data-edge="r1" points="250,120 250,210" fill="none" stroke="#323232" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-f9c2f305de-arrow)"/>
<polyline data-edge="r2" points="610,120 610,210" fill="none" stroke="#323232" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-f9c2f305de-arrow)"/>
<polyline data-edge="r3" points="250,340 250,430" fill="none" stroke="#323232" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-f9c2f305de-arrow)"/>
<polyline data-edge="r4" points="610,340 610,430" fill="none" stroke="#323232" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-f9c2f305de-arrow)"/>
<g id="dc-f9c2f305de-node-asset" data-node="asset" data-x="20" data-y="20" data-w="370" data-h="100">
<rect x="20" y="20" width="370" height="100" rx="6" fill="#f3f3f3" stroke="#323232" stroke-width="1.5"/>
<text x="38" y="67.5" font-size="18" font-weight="650" fill="#000000" text-anchor="start" data-node-text="asset"><tspan x="38" dy="0">Asset</tspan></text>
<text x="38" y="93.5" font-size="13" font-weight="400" fill="#323232" text-anchor="start" data-node-text="asset"><tspan x="38" dy="0">PK tenant + asset; cached from ERP</tspan></text>
</g>
<g id="dc-f9c2f305de-node-user" data-node="user" data-x="470" data-y="20" data-w="370" data-h="100">
<rect x="470" y="20" width="370" height="100" rx="6" fill="#f3f3f3" stroke="#323232" stroke-width="1.5"/>
<text x="488" y="58.5" font-size="18" font-weight="650" fill="#000000" text-anchor="start" data-node-text="user"><tspan x="488" dy="0">Customer user</tspan></text>
<text x="488" y="84.5" font-size="13" font-weight="400" fill="#323232" text-anchor="start" data-node-text="user"><tspan x="488" dy="0">PK tenant + user; identity from the identity</tspan><tspan x="488" dy="18">provider</tspan></text>
</g>
<g id="dc-f9c2f305de-node-req" data-node="req" data-x="130" data-y="210" data-w="600" data-h="130">
<rect x="130" y="210" width="600" height="130" rx="6" fill="#e8f0fe" stroke="#276ef1" stroke-width="2"/>
<text x="148" y="263.5" font-size="18" font-weight="650" fill="#000000" text-anchor="start" data-node-text="req"><tspan x="148" dy="0">ServiceRequest</tspan></text>
<text x="148" y="289.5" font-size="13" font-weight="400" fill="#323232" text-anchor="start" data-node-text="req"><tspan x="148" dy="0">PK tenant + submission ID; FK tenant + asset; unique tenant + submitter +</tspan><tspan x="148" dy="18">submission key; payload hash</tspan></text>
</g>
<g id="dc-f9c2f305de-node-att" data-node="att" data-x="20" data-y="430" data-w="370" data-h="100">
<rect x="20" y="430" width="370" height="100" rx="6" fill="#f3f3f3" stroke="#323232" stroke-width="1.5"/>
<text x="38" y="468.5" font-size="18" font-weight="650" fill="#000000" text-anchor="start" data-node-text="att"><tspan x="38" dy="0">Attachment</tspan></text>
<text x="38" y="494.5" font-size="13" font-weight="400" fill="#323232" text-anchor="start" data-node-text="att"><tspan x="38" dy="0">FK tenant + submission ID; object key; scan</tspan><tspan x="38" dy="18">state</tspan></text>
</g>
<g id="dc-f9c2f305de-node-out" data-node="out" data-x="470" data-y="430" data-w="370" data-h="100">
<rect x="470" y="430" width="370" height="100" rx="6" fill="#f3f3f3" stroke="#323232" stroke-width="1.5"/>
<text x="488" y="468.5" font-size="18" font-weight="650" fill="#000000" text-anchor="start" data-node-text="out"><tspan x="488" dy="0">Outbox</tspan></text>
<text x="488" y="494.5" font-size="13" font-weight="400" fill="#323232" text-anchor="start" data-node-text="out"><tspan x="488" dy="0">PK event; FK tenant + submission ID; handoff</tspan><tspan x="488" dy="18">state, attempts</tspan></text>
</g>
