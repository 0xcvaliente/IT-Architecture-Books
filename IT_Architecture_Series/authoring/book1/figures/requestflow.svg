<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 410" width="860" height="410" role="img" aria-labelledby="dc-eeb29857c7-title dc-eeb29857c7-desc" font-family="DejaVu Sans">
<title id="dc-eeb29857c7-title">Submission and background processing</title>
<desc id="dc-eeb29857c7-desc">The customer submits metadata to the submission API, which writes the request and outbox record atomically and returns a receipt. Attachments upload to object storage through an authorised path. In the background, a worker reads pending work and hands it off to the CRM. Solid arrows show foreground requests and responses; dashed arrows show background processing.</desc>
<defs><marker id="dc-eeb29857c7-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#323232"/></marker></defs>
<rect width="860" height="410" fill="#ffffff" aria-hidden="true"/>
<polyline data-edge="submit" points="220,60 330,60" fill="none" stroke="#323232" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-eeb29857c7-arrow)"/>
<polyline data-edge="receipt" points="330,95 220,95" fill="none" stroke="#323232" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-eeb29857c7-arrow)"/>
<polyline data-edge="write" points="530,75 640,75" fill="none" stroke="#323232" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-eeb29857c7-arrow)"/>
<polyline data-edge="upload" points="120,120 120,300" fill="none" stroke="#323232" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-eeb29857c7-arrow)"/>
<polyline data-edge="read" points="740,120 740,300" fill="none" stroke="#323232" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-eeb29857c7-arrow)" stroke-dasharray="6 5"/>
<polyline data-edge="handoff" points="640,345 530,345" fill="none" stroke="#323232" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-eeb29857c7-arrow)" stroke-dasharray="6 5"/>
