<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" width="860" height="460" role="img" aria-labelledby="dc-2244596244-title dc-2244596244-desc" font-family="DejaVu Sans">
<title id="dc-2244596244-title">Majority quorums with five voters</title>
<desc id="dc-2244596244-desc">In a 3 | 2 partition, the side with three of five voters can elect a leader and commit, while the side with two cannot. In a 2 | 2 | 1 partition, no group holds three voters, so nothing new commits until connections return.</desc>
<defs><marker id="dc-2244596244-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#323232"/></marker></defs>
<rect width="860" height="460" fill="#ffffff" aria-hidden="true"/>
<rect x="10" y="10" width="840" height="210" rx="8" fill="none" stroke="#323232" stroke-dasharray="4 4"/>
<text x="26" y="34" font-size="13" font-weight="600" fill="#323232" text-anchor="start"><tspan x="26" dy="0">3 | 2 partition</tspan></text>
<rect x="30" y="50" width="446" height="155" rx="8" fill="none" stroke="#323232" stroke-dasharray="4 4"/>
<text x="46" y="74" font-size="13" font-weight="600" fill="#323232" text-anchor="start"><tspan x="46" dy="0">3 of 5 voters: elects a leader and commits</tspan></text>
<rect x="496" y="50" width="304" height="155" rx="8" fill="none" stroke="#323232" stroke-dasharray="4 4"/>
<text x="512" y="74" font-size="13" font-weight="600" fill="#323232" text-anchor="start"><tspan x="512" dy="0">2 of 5 voters: cannot commit</tspan></text>
<rect x="10" y="240" width="840" height="210" rx="8" fill="none" stroke="#323232" stroke-dasharray="4 4"/>
<text x="26" y="264" font-size="13" font-weight="600" fill="#323232" text-anchor="start"><tspan x="26" dy="0">2 | 2 | 1 partition: no group holds 3 of 5 voters, so nothing commits</tspan></text>
<rect x="30" y="280" width="304" height="155" rx="8" fill="none" stroke="#323232" stroke-dasharray="4 4"/>
<text x="46" y="304" font-size="13" font-weight="600" fill="#323232" text-anchor="start"><tspan x="46" dy="0">2 of 5</tspan></text>
<rect x="350" y="280" width="304" height="155" rx="8" fill="none" stroke="#323232" stroke-dasharray="4 4"/>
<text x="366" y="304" font-size="13" font-weight="600" fill="#323232" text-anchor="start"><tspan x="366" dy="0">2 of 5</tspan></text>
