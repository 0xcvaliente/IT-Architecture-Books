<text x="36" y="44" font-size="13" font-weight="600" fill="#323232" text-anchor="start"><tspan x="36" dy="0">Service case status: Received in the portal, then the CRM&#x27;s status</tspan></text>
<rect x="20" y="340" width="820" height="360" rx="8" fill="none" stroke="#323232" stroke-dasharray="4 4"/>
<text x="36" y="364" font-size="13" font-weight="600" fill="#323232" text-anchor="start"><tspan x="36" dy="0">Handoff delivery state: owned by the portal&#x27;s worker</tspan></text>
