<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 720" width="860" height="720" role="img" aria-labelledby="dc-96de4d9093-title dc-96de4d9093-desc" font-family="DejaVu Sans">
<title id="dc-96de4d9093-title">Business state and delivery state</title>
<desc id="dc-96de4d9093-desc">Upper machine: the portal shows Received until the handoff is confirmed; the CRM then owns the case, which moves from under review to approved and resolved, or to rejected. Lower machine: the handoff moves from pending to in_flight when a worker claims it, then to confirmed, to retry_due after an uncertain or temporary failure, or to manual_review after a rejection or six hours of retries. An operator can return a manual_review handoff to retry_due.</desc>
