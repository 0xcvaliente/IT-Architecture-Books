<text x="38" y="62.5" font-size="18" font-weight="650" fill="#000000" text-anchor="start" data-node-text="src"><tspan x="38" dy="0">CRM and portal</tspan></text>
<text x="38" y="88.5" font-size="13" font-weight="400" fill="#323232" text-anchor="start" data-node-text="src"><tspan x="38" dy="0">Operational sources</tspan></text>
