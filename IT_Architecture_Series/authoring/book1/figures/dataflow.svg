<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 580" width="860" height="580" role="img" aria-labelledby="dc-6963b0ccc4-title dc-6963b0ccc4-desc" font-family="DejaVu Sans">
<title id="dc-6963b0ccc4-title">Operational data to governed analytics</title>
<desc id="dc-6963b0ccc4-desc">Changes are extracted from the CRM and the portal into controlled staging, validated and transformed into a curated model, and published to reports. Quality and lineage checks run on each load and each publication, and a lifecycle policy governs retention, correction and deletion. Solid arrows show data movement; dashed arrows show checks and governance.</desc>
<defs><marker id="dc-6963b0ccc4-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#323232"/></marker></defs>
<rect width="860" height="580" fill="#ffffff" aria-hidden="true"/>
<polyline data-edge="extract" points="185.0,110 185.0,170" fill="none" stroke="#323232" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-6963b0ccc4-arrow)"/>
<polyline data-edge="transform" points="185.0,260 185.0,320" fill="none" stroke="#323232" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-6963b0ccc4-arrow)"/>
<polyline data-edge="publish" points="185.0,410 185.0,470" fill="none" stroke="#323232" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-6963b0ccc4-arrow)"/>
<polyline data-edge="chk_load" points="510,255 430,255 430,215 350,215" fill="none" stroke="#323232" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-6963b0ccc4-arrow)" stroke-dasharray="6 5"/>
<polyline data-edge="chk_pub" points="510,325 430,325 430,365 350,365" fill="none" stroke="#323232" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-6963b0ccc4-arrow)" stroke-dasharray="6 5"/>
<polyline data-edge="governs" points="675,440 675,350" fill="none" stroke="#323232" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-6963b0ccc4-arrow)" stroke-dasharray="6 5"/>
