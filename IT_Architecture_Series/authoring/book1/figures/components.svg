<rect x="20" y="20" width="820" height="300" rx="8" fill="none" stroke="#323232" stroke-dasharray="4 4"/>
<text x="36" y="44" font-size="13" font-weight="600" fill="#323232" text-anchor="start"><tspan x="36" dy="0">Portal API process: code responsibilities, not separate services</tspan></text>
<polyline data-edge="trusted" points="240,145 330,145" fill="none" stroke="#323232" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-55c08f3630-arrow)"/>
