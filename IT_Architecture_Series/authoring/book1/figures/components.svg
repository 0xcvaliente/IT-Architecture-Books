<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 490" width="860" height="490" role="img" aria-labelledby="dc-55c08f3630-title dc-55c08f3630-desc" font-family="DejaVu Sans">
<title id="dc-55c08f3630-title">Components inside the portal API</title>
<desc id="dc-55c08f3630-desc">Inside one portal API process, the HTTP controller passes trusted input to the policy and domain component, which persists the intent through a unit of work and repositories. A separate worker process uses the CRM adapter through a port contract, so the receipt path never waits for the CRM.</desc>
