<rect x="20" y="20" width="240" height="90" rx="6" fill="#f3f3f3" stroke="#323232" stroke-width="1.5"/>
<text x="38" y="71.5" font-size="18" font-weight="650" fill="#000000" text-anchor="start" data-node-text="review"><tspan x="38" dy="0">Review change</tspan></text>
</g>
<g id="dc-9b02923e91-node-build" data-node="build" data-x="310" data-y="20" data-w="240" data-h="90">
<rect x="310" y="20" width="240" height="90" rx="6" fill="#f3f3f3" stroke="#323232" stroke-width="1.5"/>
