<text x="328" y="88.5" font-size="13" font-weight="400" fill="#323232" text-anchor="start" data-node-text="build"><tspan x="328" dy="0">One identified artefact</tspan></text>
</g>
<g id="dc-9b02923e91-node-stage" data-node="stage" data-x="600" data-y="20" data-w="240" data-h="90">
