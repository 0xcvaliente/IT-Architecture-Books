<rect width="860" height="440" fill="#ffffff" aria-hidden="true"/>
<polyline data-edge="t0" points="260,65 310,65" fill="none" stroke="#323232" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-9b02923e91-arrow)"/>
<polyline data-edge="b0" points="600,375 550,375" fill="none" stroke="#323232" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-9b02923e91-arrow)"/>
<polyline data-edge="t1" points="550,65 600,65" fill="none" stroke="#323232" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-9b02923e91-arrow)"/>
<polyline data-edge="b1" points="310,375 260,375" fill="none" stroke="#323232" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-9b02923e91-arrow)"/>
