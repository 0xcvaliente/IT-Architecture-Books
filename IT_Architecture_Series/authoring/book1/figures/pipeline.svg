<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="860" height="440" role="img" aria-labelledby="dc-9b02923e91-title dc-9b02923e91-desc" font-family="DejaVu Sans">
<title id="dc-9b02923e91-title">Delivery pipeline</title>
<desc id="dc-9b02923e91-desc">A change is reviewed, built and tested, verified in staging, and the same artefact is promoted under release controls. Production is observed, and the team learns and feeds improvements back into review. The same tested build is promoted and configuration stays controlled.</desc>
