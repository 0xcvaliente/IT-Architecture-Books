<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 490" width="860" height="490" role="img" aria-labelledby="dc-0c2b42f22c-title dc-0c2b42f22c-desc" font-family="DejaVu Sans">
<title id="dc-0c2b42f22c-title">Example network boundaries</title>
<desc id="dc-0c2b42f22c-desc">Three subnets: ingress with the public HTTPS edge, runtime with the API and worker, and data with a private endpoint. TLS protects the edge-to-API and API-to-database connections. Operators reach the runtime only through a controlled management path, and outbound calls to the CRM vendor pass an egress policy.</desc>
<defs><marker id="dc-0c2b42f22c-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#323232"/></marker></defs>
<rect width="860" height="490" fill="#ffffff" aria-hidden="true"/>
<rect x="220" y="10" width="420" height="120" rx="8" fill="none" stroke="#323232" stroke-dasharray="4 4"/>
<text x="236" y="34" font-size="13" font-weight="600" fill="#323232" text-anchor="start"><tspan x="236" dy="0">Ingress 10.20.10.0/24</tspan></text>
<rect x="220" y="165" width="420" height="135" rx="8" fill="none" stroke="#323232" stroke-dasharray="4 4"/>
<text x="236" y="189" font-size="13" font-weight="600" fill="#323232" text-anchor="start"><tspan x="236" dy="0">Runtime 10.20.20.0/24</tspan></text>
<rect x="220" y="345" width="420" height="125" rx="8" fill="none" stroke="#323232" stroke-dasharray="4 4"/>
<text x="236" y="369" font-size="13" font-weight="600" fill="#323232" text-anchor="start"><tspan x="236" dy="0">Data 10.20.30.0/24</tspan></text>
<polyline data-edge="tls1" points="430,115 430,205" fill="none" stroke="#323232" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-0c2b42f22c-arrow)"/>
<polyline data-edge="tls2" points="430,285 430,385" fill="none" stroke="#323232" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-0c2b42f22c-arrow)"/>
<polyline data-edge="admin" points="100,110 100,195" fill="none" stroke="#323232" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-0c2b42f22c-arrow)"/>
<polyline data-edge="scoped" points="190,250 300,250" fill="none" stroke="#323232" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-0c2b42f22c-arrow)"/>
<polyline data-edge="egress" points="560,245 680,245" fill="none" stroke="#323232" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-0c2b42f22c-arrow)"/>
<g id="dc-0c2b42f22c-node-op" data-node="op" data-x="10" data-y="20" data-w="180" data-h="90">
<rect x="10" y="20" width="180" height="90" rx="6" fill="#f3f3f3" stroke="#323232" stroke-width="1.5"/>
<text x="28" y="62.5" font-size="18" font-weight="650" fill="#000000" text-anchor="start" data-node-text="op"><tspan x="28" dy="0">Operator</tspan></text>
<text x="28" y="88.5" font-size="13" font-weight="400" fill="#323232" text-anchor="start" data-node-text="op"><tspan x="28" dy="0">Strong identity</tspan></text>
</g>
<g id="dc-0c2b42f22c-node-mgmt" data-node="mgmt" data-x="10" data-y="195" data-w="180" data-h="115">
<rect x="10" y="195" width="180" height="115" rx="6" fill="#f3f3f3" stroke="#323232" stroke-width="1.5"/>
<text x="28" y="229.5" font-size="18" font-weight="650" fill="#000000" text-anchor="start" data-node-text="mgmt"><tspan x="28" dy="0">Management</tspan><tspan x="28" dy="23">path</tspan></text>
<text x="28" y="278.5" font-size="13" font-weight="400" fill="#323232" text-anchor="start" data-node-text="mgmt"><tspan x="28" dy="0">Controlled and</tspan><tspan x="28" dy="18">audited</tspan></text>
</g>
<g id="dc-0c2b42f22c-node-edge" data-node="edge" data-x="300" data-y="45" data-w="260" data-h="70">
<rect x="300" y="45" width="260" height="70" rx="6" fill="#f3f3f3" stroke="#323232" stroke-width="1.5"/>
<text x="318" y="77.5" font-size="18" font-weight="650" fill="#000000" text-anchor="start" data-node-text="edge"><tspan x="318" dy="0">Edge</tspan></text>
<text x="318" y="103.5" font-size="13" font-weight="400" fill="#323232" text-anchor="start" data-node-text="edge"><tspan x="318" dy="0">Public HTTPS</tspan></text>
</g>
<g id="dc-0c2b42f22c-node-api" data-node="api" data-x="300" data-y="205" data-w="260" data-h="80">
<rect x="300" y="205" width="260" height="80" rx="6" fill="#e8f0fe" stroke="#276ef1" stroke-width="2"/>
<text x="318" y="242.5" font-size="18" font-weight="650" fill="#000000" text-anchor="start" data-node-text="api"><tspan x="318" dy="0">API and worker</tspan></text>
<text x="318" y="268.5" font-size="13" font-weight="400" fill="#323232" text-anchor="start" data-node-text="api"><tspan x="318" dy="0">No direct public entry</tspan></text>
</g>
<g id="dc-0c2b42f22c-node-data" data-node="data" data-x="300" data-y="385" data-w="260" data-h="70">
<rect x="300" y="385" width="260" height="70" rx="6" fill="#f3f3f3" stroke="#323232" stroke-width="1.5"/>
<text x="318" y="417.5" font-size="18" font-weight="650" fill="#000000" text-anchor="start" data-node-text="data"><tspan x="318" dy="0">Data connectivity</tspan></text>
<text x="318" y="443.5" font-size="13" font-weight="400" fill="#323232" text-anchor="start" data-node-text="data"><tspan x="318" dy="0">Private endpoint</tspan></text>
</g>
<g id="dc-0c2b42f22c-node-crm" data-node="crm" data-x="680" data-y="205" data-w="170" data-h="80">
<rect x="680" y="205" width="170" height="80" rx="6" fill="#f3f3f3" stroke="#323232" stroke-width="1.5"/>
<text x="698" y="242.5" font-size="18" font-weight="650" fill="#000000" text-anchor="start" data-node-text="crm"><tspan x="698" dy="0">CRM vendor</tspan></text>
<text x="698" y="268.5" font-size="13" font-weight="400" fill="#323232" text-anchor="start" data-node-text="crm"><tspan x="698" dy="0">Outbound HTTPS</tspan></text>
</g>
<g data-label="tls1" data-x="440" data-y="140" data-w="86" data-h="30"><rect x="440" y="140" width="86" height="30" rx="4" fill="#ffffff"/>
<text x="448" y="159" font-size="13" font-weight="400" fill="#000000" text-anchor="start"><tspan x="448" dy="0">1 API TLS</tspan></text>
</g>
<g data-label="tls2" data-x="440" data-y="320" data-w="80" data-h="30"><rect x="440" y="320" width="80" height="30" rx="4" fill="#ffffff"/>
<text x="448" y="339" font-size="13" font-weight="400" fill="#000000" text-anchor="start"><tspan x="448" dy="0">2 DB TLS</tspan></text>
</g>
<g data-label="admin" data-x="110" data-y="140" data-w="70" data-h="30"><rect x="110" y="140" width="70" height="30" rx="4" fill="#ffffff"/>
<text x="118" y="159" font-size="13" font-weight="400" fill="#000000" text-anchor="start"><tspan x="118" dy="0">3 Admin</tspan></text>
</g>
<g data-label="scoped" data-x="194" data-y="198" data-w="96" data-h="48"><rect x="194" y="198" width="96" height="48" rx="4" fill="#ffffff"/>
<text x="202" y="217" font-size="13" font-weight="400" fill="#000000" text-anchor="start"><tspan x="202" dy="0">4 Scoped</tspan><tspan x="202" dy="18">access</tspan></text>
</g>
<g data-label="egress" data-x="566" data-y="193" data-w="104" data-h="48"><rect x="566" y="193" width="104" height="48" rx="4" fill="#ffffff"/>
<text x="574" y="212" font-size="13" font-weight="400" fill="#000000" text-anchor="start"><tspan x="574" dy="0">5 Egress</tspan><tspan x="574" dy="18">policy</tspan></text>
</g>
</svg>
