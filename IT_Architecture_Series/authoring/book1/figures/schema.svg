<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 270" width="860" height="270" role="img" aria-labelledby="dc-d6736c777e-title dc-d6736c777e-desc" font-family="DejaVu Sans">
<title id="dc-d6736c777e-title">Expand, migrate and contract</title>
<desc id="dc-d6736c777e-desc">A schema change in four steps. Expand adds the new column; migrate writes both columns, backfills and switches readers. A gate checks that nothing still uses the old column before contract removes it. During expand and migrate both application versions work.</desc>
<defs><marker id="dc-d6736c777e-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#323232"/></marker></defs>
<rect width="860" height="270" fill="#ffffff" aria-hidden="true"/>
<rect x="10" y="20" width="420" height="230" rx="8" fill="none" stroke="#323232" stroke-dasharray="4 4"/>
<text x="26" y="44" font-size="13" font-weight="600" fill="#323232" text-anchor="start"><tspan x="26" dy="0">Old and new versions both work</tspan></text>
<polyline data-edge="e1" points="205,150.0 235,150.0" fill="none" stroke="#323232" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-d6736c777e-arrow)"/>
<polyline data-edge="e2" points="420,150.0 450,150.0" fill="none" stroke="#323232" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-d6736c777e-arrow)"/>
<polyline data-edge="e3" points="635,150.0 665,150.0" fill="none" stroke="#323232" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-d6736c777e-arrow)"/>
<g id="dc-d6736c777e-node-expand" data-node="expand" data-x="20" data-y="70" data-w="185" data-h="160">
<rect x="20" y="70" width="185" height="160" rx="6" fill="#f3f3f3" stroke="#323232" stroke-width="1.5"/>
<text x="38" y="129.5" font-size="18" font-weight="650" fill="#000000" text-anchor="start" data-node-text="expand"><tspan x="38" dy="0">1 Expand</tspan></text>
<text x="38" y="155.5" font-size="13" font-weight="400" fill="#323232" text-anchor="start" data-node-text="expand"><tspan x="38" dy="0">Add the new column;</tspan><tspan x="38" dy="18">the running version</tspan><tspan x="38" dy="18">ignores it</tspan></text>
</g>
<g id="dc-d6736c777e-node-migrate" data-node="migrate" data-x="235" data-y="70" data-w="185" data-h="160">
<rect x="235" y="70" width="185" height="160" rx="6" fill="#f3f3f3" stroke="#323232" stroke-width="1.5"/>
<text x="253" y="129.5" font-size="18" font-weight="650" fill="#000000" text-anchor="start" data-node-text="migrate"><tspan x="253" dy="0">2 Migrate</tspan></text>
<text x="253" y="155.5" font-size="13" font-weight="400" fill="#323232" text-anchor="start" data-node-text="migrate"><tspan x="253" dy="0">Write both columns,</tspan><tspan x="253" dy="18">backfill rows,</tspan><tspan x="253" dy="18">switch every reader</tspan></text>
</g>
<g id="dc-d6736c777e-node-gate" data-node="gate" data-x="450" data-y="70" data-w="185" data-h="160">
<rect x="450" y="70" width="185" height="160" rx="6" fill="#e8f0fe" stroke="#276ef1" stroke-width="2"/>
<text x="468" y="120.5" font-size="18" font-weight="650" fill="#000000" text-anchor="start" data-node-text="gate"><tspan x="468" dy="0">3 Gate</tspan></text>
<text x="468" y="146.5" font-size="13" font-weight="400" fill="#323232" text-anchor="start" data-node-text="gate"><tspan x="468" dy="0">No version uses the</tspan><tspan x="468" dy="18">old column;</tspan><tspan x="468" dy="18">recovery now rolls</tspan><tspan x="468" dy="18">forward</tspan></text>
</g>
<g id="dc-d6736c777e-node-contract" data-node="contract" data-x="665" data-y="70" data-w="185" data-h="160">
<rect x="665" y="70" width="185" height="160" rx="6" fill="#f3f3f3" stroke="#323232" stroke-width="1.5"/>
<text x="683" y="129.5" font-size="18" font-weight="650" fill="#000000" text-anchor="start" data-node-text="contract"><tspan x="683" dy="0">4 Contract</tspan></text>
<text x="683" y="155.5" font-size="13" font-weight="400" fill="#323232" text-anchor="start" data-node-text="contract"><tspan x="683" dy="0">Drop the old column</tspan><tspan x="683" dy="18">in a separate</tspan><tspan x="683" dy="18">release</tspan></text>
</g>
</svg>
