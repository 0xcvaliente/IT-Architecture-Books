<text x="388" y="110.5" font-size="13" font-weight="400" fill="#323232" text-anchor="start" data-node-text="l1"><tspan x="388" dy="0">CRM down for 30 minutes: every accepted request reaches</tspan><tspan x="388" dy="18">the CRM after recovery</tspan></text>
</g>
