<text x="388" y="620.5" font-size="13" font-weight="400" fill="#323232" text-anchor="start" data-node-text="l6"><tspan x="388" dy="0">New CRM vendor: changes confined to the adapter, done</tspan><tspan x="388" dy="18">within six weeks</tspan></text>
