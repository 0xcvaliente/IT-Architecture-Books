<text x="388" y="314.5" font-size="13" font-weight="400" fill="#323232" text-anchor="start" data-node-text="l3"><tspan x="388" dy="0">20 submissions per second for 10 minutes: 95% of receipts</tspan><tspan x="388" dy="18">within 1 second</tspan></text>
</g>
