<text x="388" y="416.5" font-size="13" font-weight="400" fill="#323232" text-anchor="start" data-node-text="l4"><tspan x="388" dy="0">Agent requests a record outside their scopes: denied and</tspan><tspan x="388" dy="18">logged</tspan></text>
