<text x="388" y="212.5" font-size="13" font-weight="400" fill="#323232" text-anchor="start" data-node-text="l2"><tspan x="388" dy="0">Same key repeated: the first receipt returns, no second</tspan><tspan x="388" dy="18">case</tspan></text>
