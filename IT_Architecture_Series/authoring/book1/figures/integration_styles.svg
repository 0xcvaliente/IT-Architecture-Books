<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 662" width="860" height="662" role="img" aria-labelledby="dc-4d445e83dd-title dc-4d445e83dd-desc" font-family="DejaVu Sans">
<title id="dc-4d445e83dd-title">Four integration styles</title>
<desc id="dc-4d445e83dd-desc">File transfer: ERP writes a nightly asset file that analytics reads later. Shared database: the CRM and the portal both read and write the portal database. Remote procedure invocation: the portal calls the ERP read API and waits for the reply. Messaging: the CRM publishes an event to a channel, and the work-order integration consumes it later. Dashed arrows show asynchronous transfer; solid arrows show synchronous access.</desc>
<defs><marker id="dc-4d445e83dd-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#323232"/></marker></defs>
