<text x="36" y="34" font-size="13" font-weight="600" fill="#323232" text-anchor="start"><tspan x="36" dy="0">File transfer: a scheduled file, read later</tspan></text>
<rect x="20" y="174" width="820" height="150" rx="8" fill="none" stroke="#323232" stroke-dasharray="4 4"/>
<text x="36" y="198" font-size="13" font-weight="600" fill="#323232" text-anchor="start"><tspan x="36" dy="0">Shared database: one schema, two writers</tspan></text>
<rect x="20" y="338" width="820" height="150" rx="8" fill="none" stroke="#323232" stroke-dasharray="4 4"/>
<text x="36" y="362" font-size="13" font-weight="600" fill="#323232" text-anchor="start"><tspan x="36" dy="0">Remote procedure invocation: call and wait</tspan></text>
<rect x="20" y="502" width="820" height="150" rx="8" fill="none" stroke="#323232" stroke-dasharray="4 4"/>
<text x="36" y="526" font-size="13" font-weight="600" fill="#323232" text-anchor="start"><tspan x="36" dy="0">Messaging: asynchronous messages on a channel</tspan></text>
