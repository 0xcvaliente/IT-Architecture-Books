<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 580" width="860" height="580" role="img" aria-labelledby="dc-f9dc83087c-title dc-f9dc83087c-desc" font-family="DejaVu Sans">
<title id="dc-f9dc83087c-title">Beacon analytical platform zones</title>
<desc id="dc-f9dc83087c-desc">Sources are extracted into a restricted landing area, validated into curated tables and published to serving models. Invalid records go to quarantine. Quality and lineage checks observe serving models and gate and reconcile the landing area. Solid arrows show data movement; dashed arrows show control and observation.</desc>
<defs><marker id="dc-f9dc83087c-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#323232"/></marker></defs>
<rect width="860" height="580" fill="#ffffff" aria-hidden="true"/>
<polyline data-edge="extract" points="180,110 180,170" fill="none" stroke="#323232" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-f9dc83087c-arrow)"/>
<polyline data-edge="validate" points="180,260 180,320" fill="none" stroke="#323232" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-f9dc83087c-arrow)"/>
<polyline data-edge="publish" points="180,410 180,470" fill="none" stroke="#323232" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-f9dc83087c-arrow)"/>
<polyline data-edge="invalid" points="340,215 520,215" fill="none" stroke="#323232" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-f9dc83087c-arrow)"/>
<polyline data-edge="observe" points="340,515 450,515 450,470 520,470" fill="none" stroke="#323232" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-f9dc83087c-arrow)" stroke-dasharray="6 5"/>
<polyline data-edge="gate" points="600,410 600,290 300,290 300,260" fill="none" stroke="#323232" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-f9dc83087c-arrow)" stroke-dasharray="6 5"/>
<g id="dc-f9dc83087c-node-src" data-node="src" data-x="20" data-y="20" data-w="320" data-h="90">
<rect x="20" y="20" width="320" height="90" rx="6" fill="#f3f3f3" stroke="#323232" stroke-width="1.5"/>
<text x="38" y="62.5" font-size="18" font-weight="650" fill="#000000" text-anchor="start" data-node-text="src"><tspan x="38" dy="0">Sources</tspan></text>
<text x="38" y="88.5" font-size="13" font-weight="400" fill="#323232" text-anchor="start" data-node-text="src"><tspan x="38" dy="0">CRM, ERP and sales</tspan></text>
</g>
<g id="dc-f9dc83087c-node-land" data-node="land" data-x="20" data-y="170" data-w="320" data-h="90">
<rect x="20" y="170" width="320" height="90" rx="6" fill="#f3f3f3" stroke="#323232" stroke-width="1.5"/>
<text x="38" y="212.5" font-size="18" font-weight="650" fill="#000000" text-anchor="start" data-node-text="land"><tspan x="38" dy="0">Restricted landing</tspan></text>
<text x="38" y="238.5" font-size="13" font-weight="400" fill="#323232" text-anchor="start" data-node-text="land"><tspan x="38" dy="0">Source position and raw data</tspan></text>
</g>
<g id="dc-f9dc83087c-node-cur" data-node="cur" data-x="20" data-y="320" data-w="320" data-h="90">
<rect x="20" y="320" width="320" height="90" rx="6" fill="#f3f3f3" stroke="#323232" stroke-width="1.5"/>
<text x="38" y="362.5" font-size="18" font-weight="650" fill="#000000" text-anchor="start" data-node-text="cur"><tspan x="38" dy="0">Curated tables</tspan></text>
<text x="38" y="388.5" font-size="13" font-weight="400" fill="#323232" text-anchor="start" data-node-text="cur"><tspan x="38" dy="0">Grain and history</tspan></text>
</g>
<g id="dc-f9dc83087c-node-serve" data-node="serve" data-x="20" data-y="470" data-w="320" data-h="90">
<rect x="20" y="470" width="320" height="90" rx="6" fill="#f3f3f3" stroke="#323232" stroke-width="1.5"/>
<text x="38" y="512.5" font-size="18" font-weight="650" fill="#000000" text-anchor="start" data-node-text="serve"><tspan x="38" dy="0">Serving models</tspan></text>
<text x="38" y="538.5" font-size="13" font-weight="400" fill="#323232" text-anchor="start" data-node-text="serve"><tspan x="38" dy="0">Approved measures</tspan></text>
</g>
<g id="dc-f9dc83087c-node-quar" data-node="quar" data-x="520" data-y="170" data-w="320" data-h="90">
<rect x="520" y="170" width="320" height="90" rx="6" fill="#f3f3f3" stroke="#323232" stroke-width="1.5"/>
<text x="538" y="212.5" font-size="18" font-weight="650" fill="#000000" text-anchor="start" data-node-text="quar"><tspan x="538" dy="0">Quarantine</tspan></text>
<text x="538" y="238.5" font-size="13" font-weight="400" fill="#323232" text-anchor="start" data-node-text="quar"><tspan x="538" dy="0">Owner and resolution</tspan></text>
</g>
<g id="dc-f9dc83087c-node-qual" data-node="qual" data-x="520" data-y="410" data-w="320" data-h="100">
<rect x="520" y="410" width="320" height="100" rx="6" fill="#f3f3f3" stroke="#323232" stroke-width="1.5"/>
<text x="538" y="448.5" font-size="18" font-weight="650" fill="#000000" text-anchor="start" data-node-text="qual"><tspan x="538" dy="0">Quality and lineage</tspan></text>
<text x="538" y="474.5" font-size="13" font-weight="400" fill="#323232" text-anchor="start" data-node-text="qual"><tspan x="538" dy="0">Checks gate each versioned</tspan><tspan x="538" dy="18">publication</tspan></text>
</g>
<g data-label="extract" data-x="190" data-y="124" data-w="72" data-h="30"><rect x="190" y="124" width="72" height="30" rx="4" fill="#ffffff"/>
<text x="198" y="143" font-size="13" font-weight="400" fill="#000000" text-anchor="start"><tspan x="198" dy="0">Extract</tspan></text>
</g>
<g data-label="validate" data-x="190" data-y="274" data-w="80" data-h="30"><rect x="190" y="274" width="80" height="30" rx="4" fill="#ffffff"/>
<text x="198" y="293" font-size="13" font-weight="400" fill="#000000" text-anchor="start"><tspan x="198" dy="0">Validate</tspan></text>
</g>
<g data-label="publish" data-x="190" data-y="424" data-w="72" data-h="30"><rect x="190" y="424" width="72" height="30" rx="4" fill="#ffffff"/>
<text x="198" y="443" font-size="13" font-weight="400" fill="#000000" text-anchor="start"><tspan x="198" dy="0">Publish</tspan></text>
</g>
<g data-label="invalid" data-x="366" data-y="180" data-w="130" data-h="30"><rect x="366" y="180" width="130" height="30" rx="4" fill="#ffffff"/>
<text x="374" y="199" font-size="13" font-weight="400" fill="#000000" text-anchor="start"><tspan x="374" dy="0">Invalid records</tspan></text>
</g>
<g data-label="observe" data-x="372" data-y="480" data-w="74" data-h="30"><rect x="372" y="480" width="74" height="30" rx="4" fill="#ffffff"/>
<text x="380" y="499" font-size="13" font-weight="400" fill="#000000" text-anchor="start"><tspan x="380" dy="0">Observe</tspan></text>
</g>
<g data-label="gate" data-x="420" data-y="296" data-w="150" data-h="48"><rect x="420" y="296" width="150" height="48" rx="4" fill="#ffffff"/>
<text x="428" y="315" font-size="13" font-weight="400" fill="#000000" text-anchor="start"><tspan x="428" dy="0">Gate and</tspan><tspan x="428" dy="18">reconcile</tspan></text>
</g>
</svg>
