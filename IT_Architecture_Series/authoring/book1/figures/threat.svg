<text x="448" y="229" font-size="13" font-weight="400" fill="#000000" text-anchor="start"><tspan x="448" dy="0">Durable work</tspan></text>
</g>
<g data-label="sc" data-x="532" data-y="92" data-w="86" data-h="48"><rect x="532" y="92" width="86" height="48" rx="4" fill="#ffffff"/>
<text x="540" y="111" font-size="13" font-weight="400" fill="#000000" text-anchor="start"><tspan x="540" dy="0">Scoped</tspan><tspan x="540" dy="18">identity</tspan></text>
</g>
<g data-label="lim" data-x="532" data-y="272" data-w="86" data-h="48"><rect x="532" y="272" width="86" height="48" rx="4" fill="#ffffff"/>
<text x="540" y="291" font-size="13" font-weight="400" fill="#000000" text-anchor="start"><tspan x="540" dy="0">Limited</tspan><tspan x="540" dy="18">access</tspan></text>
</g>
</svg>
