<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 580" width="860" height="580" role="img" aria-labelledby="dc-07a73d5801-title dc-07a73d5801-desc" font-family="DejaVu Sans">
<title id="dc-07a73d5801-title">Aster order saga states</title>
<desc id="dc-07a73d5801-desc">Reserving stock moves an order from received to payment_pending, where an unknown payment outcome waits while Aster reconciles with the provider. A verified authorisation with an active reservation moves it to confirmed. A rejection releases the stock once and ends in rejected. An authorisation that arrives after the reservation expired moves the order to compensation_pending, where a void is requested; a failed void stays there, and a successful void ends in cancelled. Confirmed, rejected and cancelled are terminal: later or duplicate callbacks are recorded and change nothing.</desc>
<defs><marker id="dc-07a73d5801-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#323232"/></marker></defs>
<rect width="860" height="580" fill="#ffffff" aria-hidden="true"/>
<polyline data-edge="reserve" points="220,80 330,80" fill="none" stroke="#323232" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-07a73d5801-arrow)"/>
<polyline data-edge="confirm" points="570,80 680,80" fill="none" stroke="#323232" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-07a73d5801-arrow)"/>
<polyline data-edge="reject" points="380,140 380,210 230,210 230,270" fill="none" stroke="#323232" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-07a73d5801-arrow)"/>
<polyline data-edge="compensate" points="520,140 520,210 620,210 620,270" fill="none" stroke="#323232" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-07a73d5801-arrow)"/>
<polyline data-edge="void" points="620,380 620,470" fill="none" stroke="#323232" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-07a73d5801-arrow)"/>
<g id="dc-07a73d5801-node-received" data-node="received" data-x="20" data-y="30" data-w="200" data-h="90">
<rect x="20" y="30" width="200" height="90" rx="6" fill="#f3f3f3" stroke="#323232" stroke-width="1.5"/>
<text x="38" y="72.5" font-size="18" font-weight="650" fill="#000000" text-anchor="start" data-node-text="received"><tspan x="38" dy="0">received</tspan></text>
<text x="38" y="98.5" font-size="13" font-weight="400" fill="#323232" text-anchor="start" data-node-text="received"><tspan x="38" dy="0">Checkout received</tspan></text>
</g>
<g id="dc-07a73d5801-node-pending" data-node="pending" data-x="330" data-y="20" data-w="240" data-h="120">
<rect x="330" y="20" width="240" height="120" rx="6" fill="#e8f0fe" stroke="#276ef1" stroke-width="2"/>
<text x="348" y="59.5" font-size="18" font-weight="650" fill="#000000" text-anchor="start" data-node-text="pending"><tspan x="348" dy="0">payment_pending</tspan></text>
<text x="348" y="85.5" font-size="13" font-weight="400" fill="#323232" text-anchor="start" data-node-text="pending"><tspan x="348" dy="0">Stock reserved; an unknown</tspan><tspan x="348" dy="18">outcome waits here while</tspan><tspan x="348" dy="18">Aster reconciles</tspan></text>
</g>
<g id="dc-07a73d5801-node-confirmed" data-node="confirmed" data-x="680" data-y="30" data-w="160" data-h="100">
<rect x="680" y="30" width="160" height="100" rx="6" fill="#f3f3f3" stroke="#323232" stroke-width="1.5"/>
<text x="698" y="59.5" font-size="18" font-weight="650" fill="#000000" text-anchor="start" data-node-text="confirmed"><tspan x="698" dy="0">confirmed</tspan></text>
<text x="698" y="85.5" font-size="13" font-weight="400" fill="#323232" text-anchor="start" data-node-text="confirmed"><tspan x="698" dy="0">Terminal;</tspan><tspan x="698" dy="18">fulfilment</tspan><tspan x="698" dy="18">requested</tspan></text>
</g>
<g id="dc-07a73d5801-node-rejected" data-node="rejected" data-x="120" data-y="270" data-w="220" data-h="100">
<rect x="120" y="270" width="220" height="100" rx="6" fill="#f3f3f3" stroke="#323232" stroke-width="1.5"/>
<text x="138" y="308.5" font-size="18" font-weight="650" fill="#000000" text-anchor="start" data-node-text="rejected"><tspan x="138" dy="0">rejected</tspan></text>
<text x="138" y="334.5" font-size="13" font-weight="400" fill="#323232" text-anchor="start" data-node-text="rejected"><tspan x="138" dy="0">Terminal; stock released</tspan><tspan x="138" dy="18">once</tspan></text>
</g>
<g id="dc-07a73d5801-node-comp" data-node="comp" data-x="480" data-y="270" data-w="280" data-h="110">
<rect x="480" y="270" width="280" height="110" rx="6" fill="#f3f3f3" stroke="#323232" stroke-width="1.5"/>
<text x="498" y="313.5" font-size="18" font-weight="650" fill="#000000" text-anchor="start" data-node-text="comp"><tspan x="498" dy="0">compensation_pending</tspan></text>
<text x="498" y="339.5" font-size="13" font-weight="400" fill="#323232" text-anchor="start" data-node-text="comp"><tspan x="498" dy="0">Void requested; a failed void</tspan><tspan x="498" dy="18">stays here, visible to an owner</tspan></text>
</g>
<g id="dc-07a73d5801-node-cancelled" data-node="cancelled" data-x="480" data-y="470" data-w="280" data-h="90">
<rect x="480" y="470" width="280" height="90" rx="6" fill="#f3f3f3" stroke="#323232" stroke-width="1.5"/>
<text x="498" y="512.5" font-size="18" font-weight="650" fill="#000000" text-anchor="start" data-node-text="cancelled"><tspan x="498" dy="0">cancelled</tspan></text>
<text x="498" y="538.5" font-size="13" font-weight="400" fill="#323232" text-anchor="start" data-node-text="cancelled"><tspan x="498" dy="0">Terminal; payment voided</tspan></text>
</g>
<g data-label="reserve" data-x="225" data-y="26" data-w="100" data-h="48"><rect x="225" y="26" width="100" height="48" rx="4" fill="#ffffff"/>
<text x="233" y="45" font-size="13" font-weight="400" fill="#000000" text-anchor="start"><tspan x="233" dy="0">reserve</tspan><tspan x="233" dy="18">stock</tspan></text>
</g>
<g data-label="confirm" data-x="572" data-y="8" data-w="106" data-h="66"><rect x="572" y="8" width="106" height="66" rx="4" fill="#ffffff"/>
<text x="580" y="27" font-size="13" font-weight="400" fill="#000000" text-anchor="start"><tspan x="580" dy="0">authorised,</tspan><tspan x="580" dy="18">reservation</tspan><tspan x="580" dy="18">active</tspan></text>
</g>
<g data-label="reject" data-x="232" data-y="174" data-w="146" data-h="30"><rect x="232" y="174" width="146" height="30" rx="4" fill="#ffffff"/>
<text x="240" y="193" font-size="13" font-weight="400" fill="#000000" text-anchor="start"><tspan x="240" dy="0">payment rejected</tspan></text>
</g>
<g data-label="compensate" data-x="632" data-y="214" data-w="196" data-h="30"><rect x="632" y="214" width="196" height="30" rx="4" fill="#ffffff"/>
<text x="640" y="233" font-size="13" font-weight="400" fill="#000000" text-anchor="start"><tspan x="640" dy="0">authorised after expiry</tspan></text>
</g>
<g data-label="void" data-x="630" data-y="408" data-w="116" data-h="30"><rect x="630" y="408" width="116" height="30" rx="4" fill="#ffffff"/>
<text x="638" y="427" font-size="13" font-weight="400" fill="#000000" text-anchor="start"><tspan x="638" dy="0">void succeeds</tspan></text>
</g>
</svg>
