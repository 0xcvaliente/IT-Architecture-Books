<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 740" width="860" height="740" role="img" aria-labelledby="dc-6087cd91b3-title dc-6087cd91b3-desc" font-family="DejaVu Sans">
<title id="dc-6087cd91b3-title">Meridian Service Portal containers</title>
<desc id="dc-6087cd91b3-desc">The portal API stores receipts and outbox records in one transaction and reads ERP facts from a versioned read model. A handoff worker delivers submissions to the CRM, and the CRM sends case status updates back to the portal API, which projects them for customers. When the CRM approves a case it emits ServiceCaseApproved; the work-order integration consumes it and creates the ERP work order. A sync job refreshes the ERP read model through ERP&#x27;s read API. Everything inside the Meridian solution boundary is run by the portal team. Solid arrows are synchronous calls or writes; dashed arrows are asynchronous events or status updates.</desc>
