<path d="M660 64 H810 M660 126 H810" stroke="#323232" fill="none"/>
<text x="668" y="101.5" font-size="18" font-weight="650" fill="#000000" text-anchor="start" data-node-text="db_b"><tspan x="668" dy="0">Database B</tspan></text>
</g>
<g id="dc-051d750f21-node-bridge_app" data-node="bridge_app" data-x="40" data-y="250" data-w="300" data-h="100">
<rect x="40" y="250" width="300" height="100" rx="6" fill="#f3f3f3" stroke="#323232" stroke-width="1.5"/>
<text x="58" y="297.5" font-size="18" font-weight="650" fill="#000000" text-anchor="start" data-node-text="bridge_app"><tspan x="58" dy="0">Shared application</tspan></text>
<text x="58" y="323.5" font-size="13" font-weight="400" fill="#323232" text-anchor="start" data-node-text="bridge_app"><tspan x="58" dy="0">All tenants</tspan></text>
</g>
<g id="dc-051d750f21-node-tables_a" data-node="tables_a" data-x="470" data-y="245" data-w="320" data-h="60">
<rect x="470" y="245" width="320" height="60" rx="6" fill="#f3f3f3" stroke="#323232" stroke-width="1.5"/>
<path d="M480 254 H780 M480 296 H780" stroke="#323232" fill="none"/>
<text x="488" y="281.5" font-size="18" font-weight="650" fill="#000000" text-anchor="start" data-node-text="tables_a"><tspan x="488" dy="0">A tables</tspan></text>
</g>
<g id="dc-051d750f21-node-tables_b" data-node="tables_b" data-x="470" data-y="320" data-w="320" data-h="60">
<rect x="470" y="320" width="320" height="60" rx="6" fill="#f3f3f3" stroke="#323232" stroke-width="1.5"/>
<path d="M480 329 H780 M480 371 H780" stroke="#323232" fill="none"/>
<text x="488" y="356.5" font-size="18" font-weight="650" fill="#000000" text-anchor="start" data-node-text="tables_b"><tspan x="488" dy="0">B tables</tspan></text>
</g>
<g id="dc-051d750f21-node-pool_app" data-node="pool_app" data-x="40" data-y="470" data-w="300" data-h="100">
<rect x="40" y="470" width="300" height="100" rx="6" fill="#f3f3f3" stroke="#323232" stroke-width="1.5"/>
<text x="58" y="517.5" font-size="18" font-weight="650" fill="#000000" text-anchor="start" data-node-text="pool_app"><tspan x="58" dy="0">Shared application</tspan></text>
<text x="58" y="543.5" font-size="13" font-weight="400" fill="#323232" text-anchor="start" data-node-text="pool_app"><tspan x="58" dy="0">All tenants</tspan></text>
</g>
<g id="dc-051d750f21-node-pool_tables" data-node="pool_tables" data-x="440" data-y="465" data-w="380" data-h="110">
<rect x="440" y="465" width="380" height="110" rx="6" fill="#e8f0fe" stroke="#276ef1" stroke-width="2"/>
<path d="M450 474 H810 M450 566 H810" stroke="#276ef1" fill="none"/>
<text x="458" y="508.5" font-size="18" font-weight="650" fill="#000000" text-anchor="start" data-node-text="pool_tables"><tspan x="458" dy="0">Shared tables</tspan></text>
<text x="458" y="534.5" font-size="13" font-weight="400" fill="#323232" text-anchor="start" data-node-text="pool_tables"><tspan x="458" dy="0">tenant_id on every row, filtered by row-level</tspan><tspan x="458" dy="18">security</tspan></text>
</g>
</svg>
