<line x1="770.0" y1="412" x2="96.0" y2="412" stroke="#323232" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/>
<rect x="310.45" y="388" width="239.10000000000002" height="19" fill="#ffffff"/>
<text x="430.0" y="403" font-size="13" fill="#000000" text-anchor="middle">7 Verified match or ambiguity</text>
