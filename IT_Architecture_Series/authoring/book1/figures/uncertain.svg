<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 596" width="860" height="596" role="img" aria-labelledby="t d" font-family="DejaVu Sans">
<title id="t">Uncertain CRM outcome</title>
<desc id="d">The worker claims the original command and creates the case with a stable external reference. The CRM commits the case but the response is lost. The worker records the unknown outcome, queries by the original reference and either confirms the mapping or sends the handoff to manual review.</desc>
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#323232"/></marker></defs>
