<text x="430.0" y="42" font-size="15" font-weight="bold" fill="#000000" text-anchor="middle">Local DB</text>
<line x1="770.0" y1="60" x2="770.0" y2="526" stroke="#323232" stroke-width="1.2" stroke-dasharray="5 4"/>
<rect x="695.0" y="12" width="150" height="48" rx="6" fill="#f3f3f3" stroke="#323232" stroke-width="1.5"/>
<text x="770.0" y="42" font-size="15" font-weight="bold" fill="#000000" text-anchor="middle">CRM</text>
<line x1="90.0" y1="100" x2="424.0" y2="100" stroke="#323232" stroke-width="2" marker-end="url(#ah)"/>
<rect x="160.2" y="76" width="199.60000000000002" height="19" fill="#ffffff"/>
<text x="260.0" y="91" font-size="13" fill="#000000" text-anchor="middle">1 Claim original command</text>
<line x1="90.0" y1="152" x2="764.0" y2="152" stroke="#323232" stroke-width="2" marker-end="url(#ah)"/>
<rect x="270.95" y="128" width="318.1" height="19" fill="#ffffff"/>
<text x="430.0" y="143" font-size="13" fill="#000000" text-anchor="middle">2 Create with stable external reference</text>
<rect x="702.0" y="182" width="136" height="32" rx="4" fill="#e8f0fe" stroke="#276ef1" stroke-width="1.5"/>
<text x="770.0" y="203" font-size="13" fill="#000000" text-anchor="middle">3 Case commits</text>
<line x1="770.0" y1="256" x2="96.0" y2="256" stroke="#323232" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/>
<rect x="326.25" y="232" width="207.5" height="19" fill="#ffffff"/>
<text x="430.0" y="247" font-size="13" fill="#000000" text-anchor="middle">4 Response lost / timeout</text>
<line x1="90.0" y1="308" x2="424.0" y2="308" stroke="#323232" stroke-width="2" marker-end="url(#ah)"/>
<rect x="160.2" y="284" width="199.60000000000002" height="19" fill="#ffffff"/>
<text x="260.0" y="299" font-size="13" fill="#000000" text-anchor="middle">5 Record unknown outcome</text>
<line x1="90.0" y1="360" x2="764.0" y2="360" stroke="#323232" stroke-width="2" marker-end="url(#ah)"/>
