<text x="178" y="438.5" font-size="18" font-weight="650" fill="#000000" text-anchor="start" data-node-text="api_c"><tspan x="178" dy="0">API C</tspan></text>
<text x="178" y="464.5" font-size="13" font-weight="400" fill="#323232" text-anchor="start" data-node-text="api_c"><tspan x="178" dy="0">Bounded</tspan><tspan x="178" dy="18">connection pool</tspan></text>
</g>
<g id="dc-a5ecef96cb-node-db" data-node="db" data-x="365" data-y="50" data-w="150" data-h="460">
<rect x="365" y="50" width="150" height="460" rx="6" fill="#e8f0fe" stroke="#276ef1" stroke-width="2"/>
<path d="M375 59 H505 M375 501 H505" stroke="#276ef1" fill="none"/>
<text x="383" y="248.0" font-size="18" font-weight="650" fill="#000000" text-anchor="start" data-node-text="db"><tspan x="383" dy="0">Managed</tspan><tspan x="383" dy="23">database</tspan></text>
<text x="383" y="297.0" font-size="13" font-weight="400" fill="#323232" text-anchor="start" data-node-text="db"><tspan x="383" dy="0">PostgreSQL,</tspan><tspan x="383" dy="18">zone-redundant;</tspan><tspan x="383" dy="18">failover tested</tspan></text>
</g>
<g id="dc-a5ecef96cb-node-crm" data-node="crm" data-x="750" data-y="60" data-w="100" data-h="280">
