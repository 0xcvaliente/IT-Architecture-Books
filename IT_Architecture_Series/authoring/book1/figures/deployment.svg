<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 640" width="860" height="640" role="img" aria-labelledby="dc-a5ecef96cb-title dc-a5ecef96cb-desc" font-family="DejaVu Sans">
<title id="dc-a5ecef96cb-title">Meridian deployment across three zones</title>
<desc id="dc-a5ecef96cb-desc">A public edge sends HTTPS traffic to one API replica in each of three zones. Zones A and B also run a handoff worker, and each worker calls the external CRM. Every API replica and every worker connects to the same zone-redundant managed database, drawn across the zones. Identity, DNS, secrets and deployment configuration are shared by all zones.</desc>
<defs><marker id="dc-a5ecef96cb-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#323232"/></marker></defs>
<rect width="860" height="640" fill="#ffffff" aria-hidden="true"/>
<rect x="140" y="20" width="600" height="150" rx="8" fill="none" stroke="#323232" stroke-dasharray="4 4"/>
<text x="156" y="44" font-size="13" font-weight="600" fill="#323232" text-anchor="start"><tspan x="156" dy="0">Zone A</tspan></text>
<rect x="140" y="190" width="600" height="150" rx="8" fill="none" stroke="#323232" stroke-dasharray="4 4"/>
<text x="156" y="214" font-size="13" font-weight="600" fill="#323232" text-anchor="start"><tspan x="156" dy="0">Zone B</tspan></text>
<rect x="140" y="360" width="600" height="150" rx="8" fill="none" stroke="#323232" stroke-dasharray="4 4"/>
<text x="156" y="384" font-size="13" font-weight="600" fill="#323232" text-anchor="start"><tspan x="156" dy="0">Zone C</tspan></text>
<polyline data-edge="lb_a" points="120,110 160,110" fill="none" stroke="#323232" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-a5ecef96cb-arrow)"/>
<polyline data-edge="a_db" points="310,110 365,110" fill="none" stroke="#323232" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-a5ecef96cb-arrow)"/>
<polyline data-edge="wa_db" points="570,110 515,110" fill="none" stroke="#323232" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-a5ecef96cb-arrow)"/>
<polyline data-edge="wa_crm" points="710,110 750,110" fill="none" stroke="#323232" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-a5ecef96cb-arrow)"/>
<polyline data-edge="lb_b" points="120,280 160,280" fill="none" stroke="#323232" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-a5ecef96cb-arrow)"/>
<polyline data-edge="b_db" points="310,280 365,280" fill="none" stroke="#323232" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-a5ecef96cb-arrow)"/>
<polyline data-edge="wb_db" points="570,280 515,280" fill="none" stroke="#323232" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-a5ecef96cb-arrow)"/>
<polyline data-edge="wb_crm" points="710,280 750,280" fill="none" stroke="#323232" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-a5ecef96cb-arrow)"/>
<polyline data-edge="lb_c" points="120,450 160,450" fill="none" stroke="#323232" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-a5ecef96cb-arrow)"/>
<polyline data-edge="c_db" points="310,450 365,450" fill="none" stroke="#323232" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-a5ecef96cb-arrow)"/>
<g id="dc-a5ecef96cb-node-edge" data-node="edge" data-x="10" data-y="60" data-w="110" data-h="450">
<rect x="10" y="60" width="110" height="450" rx="6" fill="#f3f3f3" stroke="#323232" stroke-width="1.5"/>
<text x="28" y="235.0" font-size="18" font-weight="650" fill="#000000" text-anchor="start" data-node-text="edge"><tspan x="28" dy="0">Public</tspan><tspan x="28" dy="23">edge</tspan></text>
<text x="28" y="284.0" font-size="13" font-weight="400" fill="#323232" text-anchor="start" data-node-text="edge"><tspan x="28" dy="0">Load</tspan><tspan x="28" dy="18">balancer;</tspan><tspan x="28" dy="18">HTTPS to</tspan><tspan x="28" dy="18">healthy</tspan><tspan x="28" dy="18">APIs</tspan></text>
</g>
