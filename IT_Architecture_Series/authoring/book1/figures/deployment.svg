<text x="178" y="268.5" font-size="18" font-weight="650" fill="#000000" text-anchor="start" data-node-text="api_b"><tspan x="178" dy="0">API B</tspan></text>
<text x="178" y="294.5" font-size="13" font-weight="400" fill="#323232" text-anchor="start" data-node-text="api_b"><tspan x="178" dy="0">Bounded</tspan><tspan x="178" dy="18">connection pool</tspan></text>
</g>
<g id="dc-a5ecef96cb-node-worker_b" data-node="worker_b" data-x="570" data-y="235" data-w="140" data-h="90">
