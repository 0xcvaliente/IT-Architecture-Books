<text x="768" y="196.5" font-size="13" font-weight="400" fill="#323232" text-anchor="start" data-node-text="crm"><tspan x="768" dy="0">External</tspan><tspan x="768" dy="18">vendor;</tspan><tspan x="768" dy="18">quota</tspan><tspan x="768" dy="18">limits</tspan></text>
