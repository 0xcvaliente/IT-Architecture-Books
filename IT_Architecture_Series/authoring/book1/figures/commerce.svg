<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 510" width="860" height="510" role="img" aria-labelledby="dc-e5dc0b0ebf-title dc-e5dc0b0ebf-desc" font-family="DejaVu Sans">
<title id="dc-e5dc0b0ebf-title">Aster commerce responsibilities</title>
<desc id="dc-e5dc0b0ebf-desc">Inside Aster&#x27;s modular application, the order module and inventory module share a local transaction boundary, and a payment adapter isolates the external payment provider. Orders and reservations commit to one database; a fulfilment worker claims outbox records and sends commands to the warehouse system.</desc>
