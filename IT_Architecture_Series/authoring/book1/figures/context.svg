<text x="258" y="622.5" font-size="13" font-weight="400" fill="#323232" text-anchor="start" data-node-text="erp"><tspan x="258" dy="0">Owns assets, contracts, entitlements and work</tspan><tspan x="258" dy="18">orders</tspan></text>
