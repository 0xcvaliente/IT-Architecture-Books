<rect x="240" y="70" width="360" height="460" rx="8" fill="none" stroke="#323232" stroke-dasharray="4 4"/>
<text x="256" y="94" font-size="13" font-weight="600" fill="#323232" text-anchor="start"><tspan x="256" dy="0">Meridian solution (portal team)</tspan></text>
