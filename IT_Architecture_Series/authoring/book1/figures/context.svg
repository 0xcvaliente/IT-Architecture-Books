<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 670" width="860" height="670" role="img" aria-labelledby="dc-12aa16db16-title dc-12aa16db16-desc" font-family="DejaVu Sans">
<title id="dc-12aa16db16-title">Meridian context view</title>
<desc id="dc-12aa16db16-desc">Customers submit service requests to the service portal, which delegates sign-in to the identity provider, hands submissions off to the CRM, receives case status back, reads asset and entitlement facts from ERP and sends reporting data to analytics. Service agents read authorised requests in the portal and approve cases in the CRM. The CRM emits a ServiceCaseApproved event that the work-order integration consumes to create the ERP work order. The dashed arrow is an asynchronous event; solid arrows are requests or data exchanges.</desc>
<defs><marker id="dc-12aa16db16-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#323232"/></marker></defs>
