<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 570" width="880" height="570" role="img" aria-labelledby="dc-6e7e1799dd-title dc-6e7e1799dd-desc" font-family="DejaVu Sans">
<title id="dc-6e7e1799dd-title">Meridian integration paths</title>
<desc id="dc-6e7e1799dd-desc">The portal API commits each submission with its handoff record in one transaction; a worker path per business unit claims its own handoffs and calls that unit&#x27;s CRM under its contract.</desc>
