<text x="38" y="68.5" font-size="18" font-weight="650" fill="#000000" text-anchor="start" data-node-text="writers"><tspan x="38" dy="0">Legacy writers</tspan></text>
<text x="38" y="94.5" font-size="13" font-weight="400" fill="#323232" text-anchor="start" data-node-text="writers"><tspan x="38" dy="0">Web shop, call centre,</tspan><tspan x="38" dy="18">jobs, partner</tspan></text>
</g>
