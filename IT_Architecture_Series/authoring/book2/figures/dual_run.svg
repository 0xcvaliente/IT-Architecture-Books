<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 555" width="880" height="555" role="img" aria-labelledby="dc-0849d9b35f-title dc-0849d9b35f-desc" font-family="DejaVu Sans">
<title id="dc-0849d9b35f-title">Dual run</title>
<desc id="dc-0849d9b35f-desc">During the dual run the legacy database stays authoritative, CDC fills the new store, the new service runs in shadow, and a daily reconciliation compares replicated data and shadow results.</desc>
