<rect x="20" y="45" width="250" height="95" rx="6" fill="#f3f3f3" stroke="#323232" stroke-width="1.5"/>
<text x="38" y="78.5" font-size="18" font-weight="650" fill="#000000" text-anchor="start" data-node-text="web"><tspan x="38" dy="0">Web shop and call</tspan><tspan x="38" dy="23">centre</tspan></text>
<text x="38" y="127.5" font-size="13" font-weight="400" fill="#323232" text-anchor="start" data-node-text="web"><tspan x="38" dy="0">Customer and agent orders</tspan></text>
