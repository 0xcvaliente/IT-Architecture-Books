<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 490" width="880" height="490" role="img" aria-labelledby="dc-ee24da965f-title dc-ee24da965f-desc" font-family="DejaVu Sans">
<title id="dc-ee24da965f-title">Writers of the legacy order tables</title>
<desc id="dc-ee24da965f-desc">The web shop and call centre write through the order API, while a partner account, scheduled jobs and a support script write directly to the tables.</desc>
