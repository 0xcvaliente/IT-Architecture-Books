<rect x="575" y="10" width="285" height="465" rx="8" fill="none" stroke="#323232" stroke-dasharray="4 4"/>
<text x="591" y="34" font-size="13" font-weight="600" fill="#323232" text-anchor="start"><tspan x="591" dy="0">Direct writers bypass the seam</tspan></text>
