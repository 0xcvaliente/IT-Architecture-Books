<polyline data-edge="k1" points="300,126 300,160 145,160 145,200" fill="none" stroke="#323232" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-8376b5243d-arrow)"/>
<polyline data-edge="k2" points="440,126 440,200" fill="none" stroke="#323232" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-8376b5243d-arrow)"/>
<polyline data-edge="k3" points="580,126 580,160 735,160 735,200" fill="none" stroke="#323232" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-8376b5243d-arrow)"/>
<polyline data-edge="a1" points="145,310 145,345 300,345 300,380" fill="none" stroke="#323232" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-8376b5243d-arrow)"/>
<polyline data-edge="a2" points="440,310 440,380" fill="none" stroke="#323232" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-8376b5243d-arrow)"/>
<polyline data-edge="a3" points="735,310 735,345 580,345 580,380" fill="none" stroke="#323232" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-8376b5243d-arrow)"/>
