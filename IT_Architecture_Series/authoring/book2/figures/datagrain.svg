<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-labelledby="dc-8376b5243d-title dc-8376b5243d-desc" font-family="DejaVu Sans">
<title id="dc-8376b5243d-title">Grain and dimensions</title>
<desc id="dc-8376b5243d-desc">Three facts at different grains share governed dimensions and are aggregated to a common grain before measures are combined.</desc>
