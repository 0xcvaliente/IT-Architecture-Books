<rect x="250" y="30" width="380" height="96" rx="6" fill="#e8f0fe" stroke="#276ef1" stroke-width="2"/>
<text x="268" y="66.5" font-size="18" font-weight="650" fill="#000000" text-anchor="start" data-node-text="dim"><tspan x="268" dy="0">Governed dimensions</tspan></text>
<text x="268" y="92.5" font-size="13" font-weight="400" fill="#323232" text-anchor="start" data-node-text="dim"><tspan x="268" dy="0">Customer, division and date, with</tspan><tspan x="268" dy="18">source-qualified identities</tspan></text>
</g>
<g id="dc-8376b5243d-node-ev" data-node="ev" data-x="20" data-y="200" data-w="250" data-h="110">
<rect x="20" y="200" width="250" height="110" rx="6" fill="#f3f3f3" stroke="#323232" stroke-width="1.5"/>
<text x="38" y="243.5" font-size="18" font-weight="650" fill="#000000" text-anchor="start" data-node-text="ev"><tspan x="38" dy="0">Service event</tspan></text>
<text x="38" y="269.5" font-size="13" font-weight="400" fill="#323232" text-anchor="start" data-node-text="ev"><tspan x="38" dy="0">One row per event and</tspan><tspan x="38" dy="18">version</tspan></text>
</g>
<g id="dc-8376b5243d-node-snap" data-node="snap" data-x="315" data-y="200" data-w="250" data-h="110">
<rect x="315" y="200" width="250" height="110" rx="6" fill="#f3f3f3" stroke="#323232" stroke-width="1.5"/>
<text x="333" y="243.5" font-size="18" font-weight="650" fill="#000000" text-anchor="start" data-node-text="snap"><tspan x="333" dy="0">Request snapshot</tspan></text>
<text x="333" y="269.5" font-size="13" font-weight="400" fill="#323232" text-anchor="start" data-node-text="snap"><tspan x="333" dy="0">One row per request, date</tspan><tspan x="333" dy="18">and publication</tspan></text>
</g>
<g id="dc-8376b5243d-node-comp" data-node="comp" data-x="610" data-y="200" data-w="250" data-h="110">
<rect x="610" y="200" width="250" height="110" rx="6" fill="#f3f3f3" stroke="#323232" stroke-width="1.5"/>
<text x="628" y="243.5" font-size="18" font-weight="650" fill="#000000" text-anchor="start" data-node-text="comp"><tspan x="628" dy="0">Completion</tspan></text>
<text x="628" y="269.5" font-size="13" font-weight="400" fill="#323232" text-anchor="start" data-node-text="comp"><tspan x="628" dy="0">One row per qualifying first</tspan><tspan x="628" dy="18">closure</tspan></text>
