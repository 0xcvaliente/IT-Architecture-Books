<text x="38" y="75.5" font-size="18" font-weight="650" fill="#000000" text-anchor="start" data-node-text="brief"><tspan x="38" dy="0">Decision brief</tspan></text>
<text x="38" y="101.5" font-size="13" font-weight="400" fill="#323232" text-anchor="start" data-node-text="brief"><tspan x="38" dy="0">Version and question</tspan></text>
