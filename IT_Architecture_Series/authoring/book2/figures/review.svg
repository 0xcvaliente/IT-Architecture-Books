<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="880" height="370" role="img" aria-labelledby="dc-d70b8d40a5-title dc-d70b8d40a5-desc" font-family="DejaVu Sans">
<title id="dc-d70b8d40a5-title">Review cycle</title>
<desc id="dc-d70b8d40a5-desc">A decision brief is challenged, findings become owned conditions with closure evidence, and the result is a new version of the decision.</desc>
