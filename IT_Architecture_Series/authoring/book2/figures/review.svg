<text x="353" y="92.5" font-size="13" font-weight="400" fill="#323232" text-anchor="start" data-node-text="ch"><tspan x="353" dy="0">Owners test the</tspan><tspan x="353" dy="18">evidence</tspan></text>
</g>
<g id="dc-d70b8d40a5-node-find" data-node="find" data-x="650" data-y="30" data-w="210" data-h="96">
<rect x="650" y="30" width="210" height="96" rx="6" fill="#e8f0fe" stroke="#276ef1" stroke-width="2"/>
