<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d" font-family="DejaVu Sans">
  <title id="t">A lost reply and a lagging search leave a CRM B create unknown</title>
  <desc id="d">The worker asks CRM B to create a case for request R17. CRM B commits case C91 but the reply is lost, so the worker records a timeout. A search for R17 finds no match because the search index is behind. Later the index catches up.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#323232"/>
    </marker>
  </defs>
  <rect width="1200" height="640" fill="#ffffff"/>
  <!-- participants -->
  <g font-size="20" font-weight="bold" text-anchor="middle" fill="#000000">
    <rect x="60" y="30" width="240" height="60" rx="8" fill="#f3f3f3" stroke="#323232" stroke-width="2"/>
    <text x="180" y="67">Worker</text>
    <rect x="480" y="30" width="240" height="60" rx="8" fill="#f3f3f3" stroke="#323232" stroke-width="2"/>
    <text x="600" y="67">CRM B</text>
    <rect x="880" y="30" width="280" height="60" rx="8" fill="#f3f3f3" stroke="#323232" stroke-width="2"/>
    <text x="1020" y="67">CRM B search index</text>
  </g>
  <!-- lifelines -->
  <g stroke="#323232" stroke-width="1.5" stroke-dasharray="6 6">
    <line x1="180" y1="90" x2="180" y2="585"/>
    <line x1="600" y1="90" x2="600" y2="585"/>
    <line x1="1020" y1="90" x2="1020" y2="585"/>
  </g>
  <g font-size="18" fill="#000000" text-anchor="middle">
    <!-- 1 create -->
    <line x1="180" y1="145" x2="596" y2="145" stroke="#323232" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="390" y="133">1. Create case for R17</text>
    <!-- commit -->
    <rect x="490" y="175" width="220" height="44" rx="6" fill="#f3f3f3" stroke="#323232" stroke-width="2"/>
    <text x="600" y="204">Commits case C91</text>
    <!-- 2 reply lost -->
    <line x1="600" y1="262" x2="330" y2="262" stroke="#323232" stroke-width="2.5" stroke-dasharray="10 7"/>
    <g stroke="#323232" stroke-width="3">
      <line x1="314" y1="250" x2="338" y2="274"/>
      <line x1="314" y1="274" x2="338" y2="250"/>
    </g>
    <text x="465" y="250">2. Reply lost</text>
    <!-- timeout -->
    <rect x="60" y="292" width="240" height="44" rx="6" fill="#e8f0fe" stroke="#276ef1" stroke-width="2.5"/>
    <text x="180" y="321">Outcome unknown</text>
    <!-- 3 search -->
    <line x1="180" y1="395" x2="1016" y2="395" stroke="#323232" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="390" y="383">3. Search for R17</text>
    <!-- 4 no match -->
    <line x1="1020" y1="455" x2="184" y2="455" stroke="#323232" stroke-width="2.5" stroke-dasharray="10 7" marker-end="url(#arrow)"/>
    <text x="390" y="443">4. No match: index is behind</text>
    <!-- 5 index catches up -->
    <line x1="600" y1="540" x2="1016" y2="540" stroke="#323232" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="810" y="528">5. Index now shows C91</text>
  </g>
  <!-- legend -->
  <g font-size="18" fill="#323232">
    <line x1="60" y1="620" x2="110" y2="620" stroke="#323232" stroke-width="2.5"/>
    <text x="120" y="627">Request</text>
    <line x1="230" y1="620" x2="280" y2="620" stroke="#323232" stroke-width="2.5" stroke-dasharray="10 7"/>
    <text x="290" y="626">Reply</text>
  </g>
</svg>
