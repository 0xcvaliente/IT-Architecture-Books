<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img" aria-labelledby="t d" font-family="DejaVu Sans">
<title id="t">Orion's planned cutover inside a 45-minute window</title>
<desc id="d">Steps 1 to 7 run from minute 0 to minute 33. The legacy database is fenced after step 1 and then serves status reads. CDC stops at the final log position after step 2. The new order store accepts applier writes with epoch 7 until minute 15, test orders with epoch 8 through the internal route from minute 17, and customer orders after the public switch at minute 33, when reverse CDC begins. The go decision is at minute 29, the latest safe decision at minute 39 and the window ends at minute 45.</desc>
<rect width="1000" height="540" fill="#ffffff"/>
<line x1="690.6" y1="50" x2="690.6" y2="400" stroke="#276ef1" stroke-width="2.5"/>
<line x1="868.3" y1="50" x2="868.3" y2="400" stroke="#000000" stroke-width="2" stroke-dasharray="5 5"/>
<line x1="975.0" y1="50" x2="975.0" y2="400" stroke="#000000" stroke-width="2"/>
<g font-size="16" fill="#000000"><text x="12" y="86">Steps</text><text x="12" y="156">Legacy database</text><text x="12" y="226">CDC</text><text x="12" y="296">New order store</text><text x="12" y="366">Public routing</text></g>
<g stroke="#323232" stroke-width="1.5" fill="#f3f3f3"><rect x="175.0" y="62" width="106.7" height="36"/><rect x="281.7" y="62" width="53.3" height="36"/><rect x="335.0" y="62" width="106.7" height="36"/><rect x="441.7" y="62" width="35.5" height="36"/><rect x="477.2" y="62" width="160.0" height="36"/><rect x="637.2" y="62" width="53.4" height="36"/><rect x="690.6" y="62" width="71.1" height="36"/></g>
<g font-size="16" font-weight="bold" text-anchor="middle" fill="#000000"><text x="228.3" y="86">1</text><text x="308.4" y="86">2</text><text x="388.4" y="86">3</text><text x="459.4" y="86">4</text><text x="557.2" y="86">5</text><text x="663.9" y="86">6</text><text x="726.2" y="86">7</text></g>
<rect x="175.0" y="134" width="106.7" height="34" rx="4" fill="#f3f3f3" stroke="#323232" stroke-width="1.5"/><text x="228.3" y="157" font-size="15" text-anchor="middle">Writable</text>
<rect x="281.7" y="134" width="480.0" height="34" rx="4" fill="#ffffff" stroke="#323232" stroke-width="1.5"/><text x="521.7" y="157" font-size="15" text-anchor="middle">Fenced; serves order status reads</text>
<rect x="761.7" y="134" width="213.3" height="34" rx="4" fill="#ffffff" stroke="#323232" stroke-width="1.5" stroke-dasharray="7 5"/><text x="868.4" y="157" font-size="15" text-anchor="middle">Receives reverse CDC</text>
<rect x="175.0" y="204" width="160.0" height="34" rx="4" fill="#f3f3f3" stroke="#323232" stroke-width="1.5"/><text x="255.0" y="227" font-size="15" text-anchor="middle">Legacy to new store</text>
<text x="345.0" y="227" font-size="15" fill="#323232">Stopped at the final log position</text>
<rect x="761.7" y="204" width="213.3" height="34" rx="4" fill="#ffffff" stroke="#323232" stroke-width="1.5" stroke-dasharray="7 5"/><text x="868.4" y="227" font-size="15" text-anchor="middle">Reverse: to legacy</text>
<rect x="175.0" y="274" width="266.7" height="34" rx="4" fill="#f3f3f3" stroke="#323232" stroke-width="1.5"/><text x="308.4" y="297" font-size="15" text-anchor="middle">Applier writes, epoch 7</text>
<rect x="477.2" y="274" width="284.5" height="34" rx="4" fill="#e8f0fe" stroke="#276ef1" stroke-width="1.5"/><text x="619.5" y="297" font-size="15" text-anchor="middle">Test orders, epoch 8</text>
<rect x="761.7" y="274" width="213.3" height="34" rx="4" fill="#e8f0fe" stroke="#276ef1" stroke-width="2.5"/><text x="868.4" y="297" font-size="15" text-anchor="middle" font-weight="bold">Customers, epoch 8</text>
<rect x="175.0" y="344" width="586.7" height="34" rx="4" fill="#f3f3f3" stroke="#323232" stroke-width="1.5"/><text x="468.4" y="367" font-size="15" text-anchor="middle">Legacy platform</text>
<rect x="761.7" y="344" width="213.3" height="34" rx="4" fill="#e8f0fe" stroke="#276ef1" stroke-width="2.5"/><text x="868.4" y="367" font-size="15" text-anchor="middle" font-weight="bold">New service</text>
