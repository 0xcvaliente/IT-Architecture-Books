<g font-size="15" text-anchor="middle" fill="#000000"><text x="175.0" y="434">0</text><text x="352.8" y="434">10</text><text x="530.6" y="434">20</text><text x="708.3" y="434">30</text><text x="886.1" y="434">40</text><text x="975.0" y="434">45</text><text x="575.0" y="460" font-size="16">Minutes from the start of the window</text></g>
<g font-size="15" fill="#000000"><line x1="175" y1="490" x2="211" y2="490" stroke="#276ef1" stroke-width="2.5"/><text x="219" y="495">Go decision, minute 29</text><line x1="475" y1="490" x2="511" y2="490" stroke="#000000" stroke-width="2" stroke-dasharray="5 5"/><text x="519" y="495">Latest safe decision, minute 39</text><line x1="175" y1="520" x2="211" y2="520" stroke="#000000" stroke-width="2"/><text x="219" y="525">Window ends, minute 45</text><rect x="475" y="510" width="36" height="20" rx="3" fill="#ffffff" stroke="#323232" stroke-width="1.5" stroke-dasharray="7 5"/><text x="519" y="525">Reverse CDC for 14 days after the switch</text></g>
</svg>
