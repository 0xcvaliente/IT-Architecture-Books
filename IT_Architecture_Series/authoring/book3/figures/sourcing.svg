<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" role="img" aria-labelledby="dc-3ebd34de8f-title dc-3ebd34de8f-desc" font-family="DejaVu Sans">
<title id="dc-3ebd34de8f-title">Procurement sequence: eligibility, value, conditions</title>
<desc id="dc-3ebd34de8f-desc">Procurement starts from the responsibility and scope, applies mandatory eligibility tests, compares eligible options by evidence and weighted fit, and then negotiates a conditional commitment. Options that fail a mandatory condition need a remedy or an explicit change to the requirement.</desc>
