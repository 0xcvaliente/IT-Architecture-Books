<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" role="img" aria-labelledby="dc-a1c24f8c0f-title dc-a1c24f8c0f-desc" font-family="DejaVu Sans">
<title id="dc-a1c24f8c0f-title">Operating experience can revise a workflow or the contract</title>
<desc id="dc-a1c24f8c0f-desc">An operational trial reveals a mismatch. Within the contract, the local workflow and support are updated and the trial is repeated. If shared meaning must change, an accountable owner reviews it, the enterprise contract is revised and released, and a new trial follows.</desc>
