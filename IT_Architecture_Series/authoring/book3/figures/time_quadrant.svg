<svg xmlns="http://www.w3.org/2000/svg" width="880" height="640" viewBox="0 0 880 640" role="img" aria-labelledby="t d" font-family="DejaVu Sans">
<title id="t">TIME quadrant for six Helios applications</title>
<desc id="d">Technical fitness on the horizontal axis and business value on the vertical axis, each from 1 to 5, split at 3. Migrate is high value and low fitness, Invest high on both, Eliminate low on both, Tolerate low value and high fitness. CRM North and Legacy Orders fall in Migrate; ERP Core, Identity Platform and CRM Central in Invest; Analytics Warehouse in Tolerate.</desc>
<rect width="880" height="640" fill="#ffffff"/>
<rect x="120" y="20" width="250.0" height="250.0" rx="0" fill="#f3f3f3" stroke="#323232" stroke-width="2"/>
<text x="245.0" y="56" font-size="20" font-weight="bold" text-anchor="middle" fill="#000000">Migrate</text>
<text x="245.0" y="82" font-size="14" font-weight="normal" text-anchor="middle" fill="#323232">Valuable but technically weak:</text>
<text x="245.0" y="99" font-size="14" font-weight="normal" text-anchor="middle" fill="#323232">move to a better platform</text>
<rect x="370.0" y="20" width="250.0" height="250.0" rx="0" fill="#f3f3f3" stroke="#323232" stroke-width="2"/>
<text x="495.0" y="56" font-size="20" font-weight="bold" text-anchor="middle" fill="#000000">Invest</text>
<text x="495.0" y="82" font-size="14" font-weight="normal" text-anchor="middle" fill="#323232">Valuable and sound:</text>
<text x="495.0" y="99" font-size="14" font-weight="normal" text-anchor="middle" fill="#323232">extend and improve</text>
<rect x="120" y="270.0" width="250.0" height="250.0" rx="0" fill="#f3f3f3" stroke="#323232" stroke-width="2"/>
<text x="245.0" y="458.0" font-size="20" font-weight="bold" text-anchor="middle" fill="#000000">Eliminate</text>
<text x="245.0" y="484.0" font-size="14" font-weight="normal" text-anchor="middle" fill="#323232">Low value and weak:</text>
<text x="245.0" y="501.0" font-size="14" font-weight="normal" text-anchor="middle" fill="#323232">retire when safe</text>
<rect x="370.0" y="270.0" width="250.0" height="250.0" rx="0" fill="#f3f3f3" stroke="#323232" stroke-width="2"/>
<text x="495.0" y="458.0" font-size="20" font-weight="bold" text-anchor="middle" fill="#000000">Tolerate</text>
<text x="495.0" y="484.0" font-size="14" font-weight="normal" text-anchor="middle" fill="#323232">Sound but low value:</text>
<text x="495.0" y="501.0" font-size="14" font-weight="normal" text-anchor="middle" fill="#323232">run at minimum cost</text>
<circle cx="482.5" cy="119.99999999999997" r="8" fill="#276ef1" stroke="#ffffff" stroke-width="2"/>
<text x="498.5" y="125.99999999999997" font-size="14" font-weight="bold" text-anchor="start" fill="#000000">ERP Core</text>
<circle cx="420.0" cy="170.00000000000003" r="8" fill="#276ef1" stroke="#ffffff" stroke-width="2"/>
<text x="436.0" y="176.00000000000003" font-size="14" font-weight="bold" text-anchor="start" fill="#000000">Identity Platform</text>
<circle cx="457.5" cy="232.50000000000003" r="8" fill="#276ef1" stroke="#ffffff" stroke-width="2"/>
<text x="473.5" y="238.50000000000003" font-size="14" font-weight="bold" text-anchor="start" fill="#000000">CRM Central</text>
<circle cx="245.0" cy="207.5" r="8" fill="#276ef1" stroke="#ffffff" stroke-width="2"/>
<text x="261.0" y="213.5" font-size="14" font-weight="bold" text-anchor="start" fill="#000000">CRM North</text>
<circle cx="170.0" cy="145.0" r="8" fill="#276ef1" stroke="#ffffff" stroke-width="2"/>
<text x="186.0" y="151.0" font-size="14" font-weight="bold" text-anchor="start" fill="#000000">Legacy Orders</text>
<circle cx="401.25" cy="332.5" r="8" fill="#276ef1" stroke="#ffffff" stroke-width="2"/>
<text x="417.25" y="338.5" font-size="14" font-weight="bold" text-anchor="start" fill="#000000">Analytics Warehouse</text>
<line x1="120" y1="550" x2="623.8" y2="550.0" stroke="#323232" stroke-width="2"/>
<polygon points="635.0,550.0 621.0,543.0 621.0,557.0" fill="#323232"/>
<line x1="90" y1="520" x2="90.0" y2="19.200000000000003" stroke="#323232" stroke-width="2"/>
<polygon points="90.0,8.0 83.0,22.0 97.0,22.0" fill="#323232"/>
<line x1="120.0" y1="544" x2="120.0" y2="556" stroke="#323232" stroke-width="2"/>
<text x="120.0" y="576" font-size="14" font-weight="normal" text-anchor="middle" fill="#323232">1</text>
<line x1="84" y1="520.0" x2="96" y2="520.0" stroke="#323232" stroke-width="2"/>
<text x="76" y="525.0" font-size="14" font-weight="normal" text-anchor="end" fill="#323232">1</text>
<line x1="245.0" y1="544" x2="245.0" y2="556" stroke="#323232" stroke-width="2"/>
<text x="245.0" y="576" font-size="14" font-weight="normal" text-anchor="middle" fill="#323232">2</text>
<line x1="84" y1="395.0" x2="96" y2="395.0" stroke="#323232" stroke-width="2"/>
<text x="76" y="400.0" font-size="14" font-weight="normal" text-anchor="end" fill="#323232">2</text>
<line x1="370.0" y1="544" x2="370.0" y2="556" stroke="#323232" stroke-width="2"/>
<text x="370.0" y="576" font-size="14" font-weight="normal" text-anchor="middle" fill="#323232">3</text>
<line x1="84" y1="270.0" x2="96" y2="270.0" stroke="#323232" stroke-width="2"/>
<text x="76" y="275.0" font-size="14" font-weight="normal" text-anchor="end" fill="#323232">3</text>
<line x1="495.0" y1="544" x2="495.0" y2="556" stroke="#323232" stroke-width="2"/>
<text x="495.0" y="576" font-size="14" font-weight="normal" text-anchor="middle" fill="#323232">4</text>
<line x1="84" y1="145.0" x2="96" y2="145.0" stroke="#323232" stroke-width="2"/>
<text x="76" y="150.0" font-size="14" font-weight="normal" text-anchor="end" fill="#323232">4</text>
<line x1="620.0" y1="544" x2="620.0" y2="556" stroke="#323232" stroke-width="2"/>
<text x="620.0" y="576" font-size="14" font-weight="normal" text-anchor="middle" fill="#323232">5</text>
<line x1="84" y1="20.0" x2="96" y2="20.0" stroke="#323232" stroke-width="2"/>
<text x="76" y="25.0" font-size="14" font-weight="normal" text-anchor="end" fill="#323232">5</text>
<text x="370.0" y="602" font-size="16" font-weight="normal" text-anchor="middle" fill="#000000">Technical fitness</text>
<text x="50" y="270.0" font-size="16" font-weight="normal" text-anchor="middle" fill="#000000" transform="rotate(-90 50 270.0)">Business value</text>
<text x="650" y="50" font-size="16" font-weight="bold" text-anchor="start" fill="#000000">How to read it</text>
<text x="650" y="80" font-size="14" font-weight="normal" text-anchor="start" fill="#323232">Each point is one</text>
<text x="650" y="99" font-size="14" font-weight="normal" text-anchor="start" fill="#323232">application, scored by</text>
<text x="650" y="118" font-size="14" font-weight="normal" text-anchor="start" fill="#323232">its owners and the</text>
<text x="650" y="137" font-size="14" font-weight="normal" text-anchor="start" fill="#323232">architecture team.</text>
<text x="650" y="156" font-size="14" font-weight="normal" text-anchor="start" fill="#323232"></text>
<text x="650" y="175" font-size="14" font-weight="normal" text-anchor="start" fill="#323232">The quadrant suggests</text>
<text x="650" y="194" font-size="14" font-weight="normal" text-anchor="start" fill="#323232">a disposition. Cost,</text>
<text x="650" y="213" font-size="14" font-weight="normal" text-anchor="start" fill="#323232">dependencies and exit</text>
<text x="650" y="232" font-size="14" font-weight="normal" text-anchor="start" fill="#323232">terms decide it.</text>
</svg>
