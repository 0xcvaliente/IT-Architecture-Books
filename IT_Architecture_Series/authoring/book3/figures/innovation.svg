<text x="38" y="88.5" font-size="13" font-weight="400" fill="#323232" text-anchor="start" data-node-text="u"><tspan x="38" dy="0">Business task and baseline</tspan></text>
</g>
<g id="dc-69f6a02539-node-x" data-node="x" data-x="305" data-y="20" data-w="250" data-h="90">
