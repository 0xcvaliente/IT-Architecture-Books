<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" role="img" aria-labelledby="dc-69f6a02539-title dc-69f6a02539-desc" font-family="DejaVu Sans">
<title id="dc-69f6a02539-title">A bounded experiment leads to a decision</title>
<desc id="dc-69f6a02539-desc">A decision uncertainty leads to a bounded experiment, which produces evaluation evidence. The evidence leads to one of three decisions: stop, revise or scale conditionally.</desc>
