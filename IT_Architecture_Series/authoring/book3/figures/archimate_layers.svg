<title id="t">Helios service fulfilment in ArchiMate 4</title>
<desc id="d">Business domain: the service coordinator role is assigned to the process Handle service request, which realises the service Field maintenance, which serves the customer. Application domain: CRM North realises the case management service and the customer link hub realises the customer lookup service; both services serve the process. Technology domain: the shared cloud platform node realises the container hosting service, which serves both application components.</desc>
