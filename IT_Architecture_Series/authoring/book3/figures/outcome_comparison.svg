<svg xmlns="http://www.w3.org/2000/svg" width="940" height="510" viewBox="0 0 940 510" role="img" aria-labelledby="t d" font-family="DejaVu Sans">
<title id="t">Difference-in-differences for the reconciliation pilot</title>
<desc id="d">Error rate in percent before and after the pilot. The participating division falls from 10 to 6, the comparison division from 8 to 7. A dashed line shows the assumed path of the participating division without the pilot, from 10 to 9. The 3 point gap at the end is the difference-in-differences.</desc>
<rect width="940" height="510" fill="#ffffff"/>
<line x1="130" y1="460.0" x2="640" y2="460.0" stroke="#d9d9d9" stroke-width="1"/>
<text x="116" y="465.0" font-size="14" font-weight="normal" text-anchor="end" fill="#323232">5%</text>
<line x1="130" y1="390.0" x2="640" y2="390.0" stroke="#d9d9d9" stroke-width="1"/>
<text x="116" y="395.0" font-size="14" font-weight="normal" text-anchor="end" fill="#323232">6%</text>
<line x1="130" y1="320.0" x2="640" y2="320.0" stroke="#d9d9d9" stroke-width="1"/>
<text x="116" y="325.0" font-size="14" font-weight="normal" text-anchor="end" fill="#323232">7%</text>
<line x1="130" y1="250.0" x2="640" y2="250.0" stroke="#d9d9d9" stroke-width="1"/>
<text x="116" y="255.0" font-size="14" font-weight="normal" text-anchor="end" fill="#323232">8%</text>
<line x1="130" y1="180.0" x2="640" y2="180.0" stroke="#d9d9d9" stroke-width="1"/>
<text x="116" y="185.0" font-size="14" font-weight="normal" text-anchor="end" fill="#323232">9%</text>
<line x1="130" y1="110.0" x2="640" y2="110.0" stroke="#d9d9d9" stroke-width="1"/>
<text x="116" y="115.0" font-size="14" font-weight="normal" text-anchor="end" fill="#323232">10%</text>
<line x1="130" y1="40.0" x2="640" y2="40.0" stroke="#d9d9d9" stroke-width="1"/>
<text x="116" y="45.0" font-size="14" font-weight="normal" text-anchor="end" fill="#323232">11%</text>
<line x1="130" y1="40" x2="130" y2="460" stroke="#000000" stroke-width="1.5"/>
<line x1="130" y1="460" x2="640" y2="460" stroke="#000000" stroke-width="1.5"/>
<text x="200" y="490" font-size="16" font-weight="normal" text-anchor="middle" fill="#000000">Before</text>
<text x="570" y="490" font-size="16" font-weight="normal" text-anchor="middle" fill="#000000">After</text>
<text x="60" y="250.0" font-size="16" font-weight="normal" text-anchor="middle" fill="#000000" transform="rotate(-90 60 250.0)">Error rate</text>
<line x1="200" y1="110.0" x2="570" y2="180.0" stroke="#323232" stroke-width="2.5" stroke-dasharray="9 7"/>
<line x1="200" y1="250.0" x2="570" y2="320.0" stroke="#000000" stroke-width="3"/>
<rect x="193" y="243.0" width="14" height="14" rx="1" fill="#000000" stroke="#000000" stroke-width="1"/>
<rect x="563" y="313.0" width="14" height="14" rx="1" fill="#000000" stroke="#000000" stroke-width="1"/>
<line x1="200" y1="110.0" x2="570" y2="390.0" stroke="#276ef1" stroke-width="3.5"/>
<circle cx="200" cy="110.0" r="8" fill="#276ef1"/>
<circle cx="570" cy="390.0" r="8" fill="#276ef1"/>
<line x1="598" y1="180.0" x2="598" y2="390.0" stroke="#000000" stroke-width="2"/>
<line x1="590" y1="180.0" x2="598" y2="180.0" stroke="#000000" stroke-width="2"/>
<line x1="590" y1="390.0" x2="598" y2="390.0" stroke="#000000" stroke-width="2"/>
<text x="610" y="290.0" font-size="15" font-weight="bold" text-anchor="start" fill="#000000">3 points</text>
<line x1="680" y1="90" x2="726" y2="90" stroke="#276ef1" stroke-width="3.5"/>
<circle cx="703" cy="90" r="7" fill="#276ef1"/>
<text x="740" y="95" font-size="15" font-weight="normal" text-anchor="start" fill="#000000">Participating division:</text>
<text x="740" y="114" font-size="15" font-weight="normal" text-anchor="start" fill="#000000">10% to 6%</text>
<line x1="680" y1="160" x2="726" y2="160" stroke="#000000" stroke-width="3"/>
<rect x="696" y="153" width="14" height="14" rx="1" fill="#000000" stroke="#000000" stroke-width="1"/>
<text x="740" y="165" font-size="15" font-weight="normal" text-anchor="start" fill="#000000">Comparison division:</text>
<text x="740" y="184" font-size="15" font-weight="normal" text-anchor="start" fill="#000000">8% to 7%</text>
<line x1="680" y1="230" x2="726" y2="230" stroke="#323232" stroke-width="2.5" stroke-dasharray="9 7"/>
<text x="740" y="235" font-size="15" font-weight="normal" text-anchor="start" fill="#000000">Assumed path without</text>
<text x="740" y="254" font-size="15" font-weight="normal" text-anchor="start" fill="#000000">the pilot: 10% to 9%</text>
</svg>
