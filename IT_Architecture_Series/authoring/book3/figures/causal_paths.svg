<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" role="img" aria-labelledby="dc-ca49165fdc-title dc-ca49165fdc-desc" font-family="DejaVu Sans">
<title id="dc-ca49165fdc-title">Proposed benefit mechanism and a competing influence</title>
<desc id="dc-ca49165fdc-desc">Solid arrows: the link service and correction process lead to the correct customer role being used in routing, which leads to fewer misrouted eligible requests. Dashed arrows: staffing and local capacity influence both which division is selected for the pilot and its service outcome.</desc>
<defs><marker id="dc-ca49165fdc-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#323232"/></marker></defs>
<rect width="860" height="400" fill="#ffffff" aria-hidden="true"/>
<polyline data-edge="c1" points="270,305 305,305" fill="none" stroke="#323232" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-ca49165fdc-arrow)"/>
<polyline data-edge="c2" points="555,305 590,305" fill="none" stroke="#323232" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-ca49165fdc-arrow)"/>
<polyline data-edge="c3" points="255,65 145,65 145,250" fill="none" stroke="#323232" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-ca49165fdc-arrow)" stroke-dasharray="6 5"/>
<polyline data-edge="c4" points="605,65 715,65 715,250" fill="none" stroke="#323232" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-ca49165fdc-arrow)" stroke-dasharray="6 5"/>
<g id="dc-ca49165fdc-node-staff" data-node="staff" data-x="255" data-y="20" data-w="350" data-h="90">
<rect x="255" y="20" width="350" height="90" rx="6" fill="#f3f3f3" stroke="#323232" stroke-width="1.5"/>
<text x="273" y="62.5" font-size="18" font-weight="650" fill="#000000" text-anchor="start" data-node-text="staff"><tspan x="273" dy="0">Staffing and local capacity</tspan></text>
<text x="273" y="88.5" font-size="13" font-weight="400" fill="#323232" text-anchor="start" data-node-text="staff"><tspan x="273" dy="0">Competing influence</tspan></text>
</g>
<g id="dc-ca49165fdc-node-link" data-node="link" data-x="20" data-y="250" data-w="250" data-h="110">
<rect x="20" y="250" width="250" height="110" rx="6" fill="#e8f0fe" stroke="#276ef1" stroke-width="2"/>
<text x="38" y="291.0" font-size="18" font-weight="650" fill="#000000" text-anchor="start" data-node-text="link"><tspan x="38" dy="0">Link service and</tspan><tspan x="38" dy="23">correction</tspan></text>
<text x="38" y="340.0" font-size="13" font-weight="400" fill="#323232" text-anchor="start" data-node-text="link"><tspan x="38" dy="0">Intervention</tspan></text>
</g>
<g id="dc-ca49165fdc-node-role" data-node="role" data-x="305" data-y="250" data-w="250" data-h="110">
<rect x="305" y="250" width="250" height="110" rx="6" fill="#f3f3f3" stroke="#323232" stroke-width="1.5"/>
<text x="323" y="291.0" font-size="18" font-weight="650" fill="#000000" text-anchor="start" data-node-text="role"><tspan x="323" dy="0">Correct customer</tspan><tspan x="323" dy="23">role in routing</tspan></text>
<text x="323" y="340.0" font-size="13" font-weight="400" fill="#323232" text-anchor="start" data-node-text="role"><tspan x="323" dy="0">Changed work</tspan></text>
</g>
<g id="dc-ca49165fdc-node-out" data-node="out" data-x="590" data-y="250" data-w="250" data-h="110">
