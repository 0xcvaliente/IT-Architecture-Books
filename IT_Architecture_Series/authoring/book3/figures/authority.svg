<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" role="img" aria-labelledby="dc-f850fe3c82-title dc-f850fe3c82-desc" font-family="DejaVu Sans">
<title id="dc-f850fe3c82-title">Authority by fact, connected by governed links</title>
<desc id="dc-f850fe3c82-desc">The party register, ERP Core and the division CRMs are each authoritative for different customer facts. The customer link hub connects their records with match status. Service agents use verified links only; group reporting uses a versioned mapping.</desc>
